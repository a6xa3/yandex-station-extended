# Общий вывод Spotify через системный dmix — для системного /usr/bin/aplay (32-битного, с той же
# библиотекой ALSA, что у Алисы и Alisa Voice). Наш aplay из набора 64-битный и делить dmix с ними
# не может (состояние dmix в общей памяти, у 32- и 64-битной alsa-lib оно разное), поэтому через
# asound.conf он занимает hw:0,0 монопольно: Алиса и ChatGPT при этом немеют или падают.
# Громкость та же: регулятор Master со шкалой −36 дБ и AP2 Duck (см. asound.conf).
# count — по числу каналов Master, install.sh подставляет его с колонки.
</usr/share/alsa/alsa.conf>

pcm.ap2vol_shared {
    type softvol
    slave.pcm "dmix_spk_plug"   # системный вход в dmix, им же пользуются Алиса и ChatGPT
    control { name "Master Playback Volume"; card 0; count 1 }
    resolution 256
    min_dB -36.0
    max_dB 0.0
}

pcm.ap2duck_shared {
    type softvol
    slave.pcm "ap2vol_shared"
    control { name "AP2 Duck Playback Volume"; card 0; count 1 }
    resolution 256
    min_dB -30.0
    max_dB 0.0
}

pcm.spotify_shared { type plug; slave.pcm "ap2duck_shared" }
