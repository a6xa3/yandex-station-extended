general = {
    name = "Станция 2";            // как колонка видна в списке AirPlay
    service_type = "airplay2";
    port = 7000;                   // audio-owner.sh ловит сессию по этому порту
    // Звук — в канал, оттуда его берёт системный aplay в общий dmix вместе с Алисой и
    // ChatGPT (ap2.sh run-airplay-out, etc/asound-shared.conf). Своим ALSA shairport
    // занимал hw:0,0 монопольно: Алиса и ChatGPT немели, клиент чата падал.
    output_backend = "pipe";
    mdns_backend = "avahi";
    session_timeout = 8;           // сколько держать сессию после пропажи источника
    // Громкость с iPhone/Mac двигает тот же Master, что Алиса и сенсорная панель:
    // shairport её к звуку не применяет, а передаёт airplay-volume.sh
    ignore_volume_control = "yes";
    run_this_when_volume_is_set = "/bin/sh /data/local/opt/ap2/airplay-volume.sh ";
};

pipe = {
    name = "/run/ap2-airplay.fifo";
    // формат по умолчанию "auto" — родной у потока; aplay в ap2.sh run-airplay-out ждёт этот
    output_format = "S16_LE";
    output_rate = 44100;
    output_channels = 2;
};
